.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

ND2ysAAAAGSURBVAMAuiotxqNaO8wAAAAASUVORK5CYII=", "sourceLabel": "baseline.png", "baseline": true, "interactive": false}, {"id": "list", "name": "一叠清单", "concept": "每个词一张横卡，从上往下排；遮住和打乱是底部两个厚按钮，拇指一按就到。", "typography": "系统黑体（安卓 Roboto + 思源黑体）· 英文 21 粗 · 中文 15", "palette": ["#EEF1F5", "#1B2430", "#E5484D", "#3A6FF0"], "traits": ["一屏看到 7 个词", "喇叭圆按钮在左边，红是默写、蓝是认识", "遮住后是斜纹条，点一下露出", "底部两个厚按钮"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n\u003ctitle>方案 01 · 一叠清单\u003c/title>\n\u003cstyle>\n:root {\n  --toast-b: 92px;\n  --bg: #EEF1F5; --card: #FFFFFF; --ink: #1B2430; --muted: #66707D; --line: #DFE4EA;\n  --red: #E5484D; --red-d: #B8333A; --red-t: #FDECEC;\n  --blue: #3A6FF0; --blue-d: #2648B8; --blue-t: #E8EEFE;\n  --ink-d: #000000; --ink-t: #E4E8EE;\n  --r: 16px; --shadow: 0 1px 2px rgba(27,36,48,.06), 0 8px 22px rgba(27,36,48,.07);\n  --font: system-ui, -apple-system, \"Roboto\", \"Noto Sans SC\", \"Noto Sans CJK SC\", \"PingFang SC\", sans-serif;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml { background: var(--bg); }\nbody { font: 15px/1.45 var(--font); color: var(--ink); background: var(--bg); -webkit-tap-highlight-color: transparent; }\nbutton { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }\n[x-cloak] { display: none !important; }\n\n.app { --acc: var(--ink); --acc-d: var(--ink-d); --acc-t: var(--ink-t); max-width: 480px; margin: 0 auto; min-height: 100vh; }\n.app[data-tab=\"s\"] { --acc: var(--red); --acc-d: var(--red-d); --acc-t: var(--red-t); }\n.app[data-tab=\"r\"] { --acc: var(--blue); --acc-d: var(--blue-d); --acc-t: var(--blue-t); }\n\n/* 顶部：日期一行 + 三个标签 */\n.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 12px 10px; }\n.date { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 52px; }\n.date b { display: block; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: .01em; }\n.date small { display: block; text-align: center; font-size: 12px; color: var(--muted); }\n.arrow { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); transition: transform .12s; }\n.arrow:active { transform: scale(.94); }\n.arrow svg { width: 20px; height: 20px; }\n\n.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 16px; padding: 4px; box-shadow: var(--shadow); margin-top: 6px; }\n.seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 12px; background: var(--acc-t);\n  transform: translateX(calc(var(--k) * 100%)); transition: transform .32s cubic-bezier(.3,1.25,.5,1), background-color .25s; }\n.seg button { position: relative; height: 48px; border-radius: 12px; font-size: 15px; color: var(--muted); font-weight: 600; }\n.seg button span { font-variant-numeric: tabular-nums; margin-left: 4px; font-weight: 700; }\n.seg button[aria-selected=\"true\"] { color: var(--acc); }\n\n/* 词卡 */\n.list { list-style: none; padding: 4px 12px 132px; display: grid; gap: 10px; }\n.list.slide { animation: slide .34s cubic-bezier(.2,.8,.2,1) both; }\n@keyframes slide { from { opacity: 0; transform: translateX(calc(var(--dir) * 28px)); } }\n.first .w { animation: rise .42s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(min(var(--i), 8) * 45ms + 120ms); }\n@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }\n.w { --t: var(--blue); --tt: var(--blue-t); display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center;\n  background: var(--card); border-radius: var(--r); padding: 12px 14px 12px 10px; box-shadow: var(--shadow); min-height: 76px; }\n.w.s { --t: var(--red); --tt: var(--red-t); }\n.say { width: 48px; height: 48px; border-radius: 50%; background: var(--tt); color: var(--t); display: grid; place-items: center; transition: transform .12s; position: relative; }\n.say svg { width: 22px; height: 22px; }\n.say:active { transform: scale(.92); }\n.say.ping::after { content: \"\"; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--t); animation: ping .6s ease-out forwards; }\n@keyframes ping { to { transform: scale(1.5); opacity: 0; } }\n.line1 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px; min-height: 28px; }\n.en { font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }\n.ph { font-size: 13px; color: var(--muted); }\n.line2 { display: flex; align-items: center; gap: 8px; margin-top: 2px; min-height: 24px; }\n.zh { font-size: 15px; color: #2E3A48; }\n.chip { flex: none; font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 9px; background: #F0F2F5; color: var(--muted); font-weight: 600; }\n\n/* 遮住后的样子：斜纹条，点一下露出 */\n.hide { position: relative; display: inline-flex; align-items: center; justify-content: center; height: 24px; min-width: 120px; border-radius: 8px;\n  background: repeating-linear-gradient(135deg, var(--tt) 0 7px, transparent 7px 13px), #F6F7F9; color: var(--t); font-size: 12px; font-weight: 600; }\n.reveal { animation: reveal .28s cubic-bezier(.2,.8,.2,1) both; }\n@keyframes reveal { from { opacity: 0; transform: translateY(6px); filter: blur(3px); } }\n\n/* 拇指区：底部两个厚按钮 */\n.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 14px 12px calc(14px + env(safe-area-inset-bottom));\n  background: linear-gradient(to bottom, rgba(238,241,245,0), var(--bg) 34%); }\n.bar .in { max-width: 456px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }\n.btn { height: 58px; border-radius: 16px; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;\n  background: var(--card); box-shadow: 0 4px 0 #CBD2DB, 0 10px 22px rgba(27,36,48,.10); transition: transform .08s, box-shadow .08s; }\n.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #CBD2DB, 0 4px 10px rgba(27,36,48,.08); }\n.btn.main { background: var(--acc); color: #fff; box-shadow: 0 4px 0 var(--acc-d), 0 10px 22px rgba(27,36,48,.14); }\n.btn.main:active { box-shadow: 0 1px 0 var(--acc-d), 0 4px 10px rgba(27,36,48,.10); }\n.btn svg { width: 20px; height: 20px; }\n\n.toast { position: fixed; left: 50%; bottom: calc(var(--toast-b) + env(safe-area-inset-bottom)); z-index: 20; pointer-events: none; white-space: nowrap;\n  background: rgba(27,36,48,.92); color: #fff; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 999px; animation: toast 1.7s ease both; }\n@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 8px); } 12%, 78% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }\n\u003c/style>\n\u003cscript>// 小样用的一天内容：10月13日 周二（第 1 周第 2 天）。[英文, 音标, 中文, 科目]\nwindow.DAY = {\n  date: '10月13日 周二',\n  sub: '第 1 周 · 第 2 天',\n  week: [\n    { d: '一', n: 12, k: 'study' }, { d: '二', n: 13, k: 'study', today: true }, { d: '三', n: 14, k: 'study' },\n bg); padding: 8px 12px 0; }\n.wk { display: flex; align-items: center; justify-content: space-between; height: 44px; }\n.wk b { font-size: 17px; font-weight: 700; }\n.wk b small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; }\n.wk .nav { display: flex; gap: 6px; }\n.wk .nav button { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }\n.wk .nav button:active { background: rgba(27,36,48,.06); }\n.wk svg { width: 20px; height: 20px; }\n.days { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 2px; }\n.days .pick { position: absolute; top: 0; bottom: 0; left: 0; width: calc((100% - 24px) / 7); border-radius: 14px; background: var(--card); box-shadow: var(--shadow);\n  transform: translateX(calc(var(--k) * (100% + 4px))); transition: transform .32s cubic-bezier(.3,1.25,.5,1); }\n.day { position: relative; height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--muted); }\n.day i { font-style: normal; font-size: 12px; }\n.day b { font-size: 18px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }\n.day em { font-style: normal; font-size: 10px; line-height: 12px; color: var(--muted); }\n.day.today b::after { content: \"\"; display: block; width: 5px; height: 5px; margin: 1px auto 0; border-radius: 50%; background: var(--red); }\n.tabs { position: relative; display: flex; gap: 22px; padding: 14px 4px 0; border-bottom: 1px solid var(--line); }\n.tabs button { height: 44px; font-size: 16px; font-weight: 600; color: var(--muted); }\n.tabs button span { font-variant-numeric: tabular-nums; margin-left: 4px; }\n.tabs button[aria-selected=\"true\"] { color: var(--acc); }\n.tabs .bar { position: absolute; bottom: -1px; height: 3px; border-radius: 3px; background: var(--acc); left: var(--x); width: var(--w); transition: left .3s cubic-bezier(.3,1.2,.5,1), width .3s, background-color .2s; }\n\n/* 卡片墙 */\n.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 12px 120px; }\n.grid.slide { animation: slide .34s cubic-bezier(.2,.8,.2,1) both; }\n@keyframes slide { from { opacity: 0; transform: translateX(calc(var(--dir) * 28px)); } }\n.first .fc { animation: deal .45s cubic-bezier(.2,.9,.25,1.15) both; animation-delay: calc(min(var(--i), 10) * 40ms + 100ms); }\n@keyframes deal { from { opacity: 0; transform: translateY(18px) rotate(calc(var(--tilt) * 1deg)) scale(.94); } }\n.fc { --t: var(--blue); --tt: var(--blue-t); perspective: 900px; height: 138px; }\n.fc.s { --t: var(--red); --tt: var(--red-t); }\n.flip { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,1.35,.45,1); }\n.fc.turned .flip { transform: rotateY(180deg); }\n.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow);\n  padding: 10px 10px 12px 12px; display: flex; flex-direction: column; overflow: hidden; }\n.face::before { content: \"\"; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0; background: var(--t); }\n.face.back { transform: rotateY(180deg); background: var(--tt); }\n.face.back::before { display: none; }\n.row1 { display: flex; justify-content: space-between; align-items: flex-start; min-height: 30px; }\n.chip { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 9px; background: #F0F2F5; color: var(--muted); font-weight: 600; margin-top: 4px; }\n.say { width: 44px; height: 44px; margin: -6px -6px 0 0; border-radius: 50%; color: var(--t); display: grid; place-items: center; position: relative; }\n.say i { width: 34px; height: 34px; border-radius: 50%; background: var(--tt); display: grid; place-items: center; transition: transform .12s; }\n.say:active i { transform: scale(.9); }\n.say sv t: 700; flex: 1; }\n.date b small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 8px; }\n.date button { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }\n.date button:active { background: rgba(27,36,48,.06); }\n.date svg { width: 20px; height: 20px; }\n\n/* 三叠卡：选哪一叠 */\n.piles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px; }\n.pile { --c: var(--ink); --ct: var(--ink-t); position: relative; height: 62px; text-align: left; padding: 9px 12px; border-radius: 14px; background: var(--card);\n  box-shadow: 3px 3px 0 -1px var(--card), 3px 3px 0 0 var(--line), 6px 6px 0 -1px var(--card), 6px 6px 0 0 var(--line);\n  transition: transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .25s; }\n.pile.s { --c: var(--red); --ct: var(--red-t); }\n.pile.r { --c: var(--blue); --ct: var(--blue-t); }\n.pile em { display: block; font-style: normal; font-size: 13px; color: var(--muted); font-weight: 600; }\n.pile b { font-size: 22px; line-height: 1.1; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; }\n.pile[aria-selected=\"true\"] { background: var(--c); transform: translateY(-3px); box-shadow: 3px 3px 0 -1px var(--ct), 3px 3px 0 0 var(--c), 6px 6px 0 -1px var(--ct), 6px 6px 0 0 var(--c), 0 10px 20px rgba(27,36,48,.12); }\n.pile[aria-selected=\"true\"] em, .pile[aria-selected=\"true\"] b { color: #fff; }\n\n/* 主卡和后面的卡堆 */\n.stage { position: relative; flex: 1; margin: 22px 10px 34px 0; min-height: 300px; max-height: 460px; }\n.spacer { flex: 1; max-height: 40px; }\n.under { position: absolute; left: 0; right: 0; top: 0; bottom: 0; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); transition: transform .35s cubic-bezier(.3,1.2,.5,1), opacity .35s; }\n.card { position: absolute; inset: 0; perspective: 1200px; }\n.card.enter { animation: up .42s cubic-bezier(.25,1.2,.45,1) both; }\n@keyframes up { from { transform: translate(6px, 12px) scale(.97); opacity: .6; } }\n.card.back-in { animation: back .38s cubic-bezier(.25,1.1,.45,1) both; }\n@keyframes back { from { transform: translateX(-60%) rotate(-6deg); opacity: 0; } }\n.first .card { animation: drop .55s cubic-bezier(.2,1.3,.4,1) both .1s; }\n@keyframes drop { from { transform: translateY(-40px) scale(1.04); opacity: 0; } }\n.flip { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,1.3,.45,1); }\n.card.turned .flip { transform: rotateY(180deg); }\n.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); padding: 16px 18px 20px; display: flex; flex-direction: column; }\n.face.back { transform: rotateY(180deg); }\n.meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }\n.meta b { color: var(--ink); font-size: 15px; }\n.chip { font-size: 12px; line-height: 22px; padding: 0 9px; border-radius: 11px; background: var(--tt); color: var(--t); font-weight: 700; }\n.card { --t: var(--blue); --tt: var(--blue-t); }\n.card.s { --t: var(--red); --tt: var(--red-t); }\n.body { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; gap: 6px; }\n.en { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; overflow-wrap: anywhere; }\n.ph { font-size: 16px; color: var(--muted); }\n.zh { font-size: 22px; font-weight: 600; color: #2E3A48; }\n.rule { height: 0; border-top: 2px dashed var(--line); margin: 14px 24px 8px; }\n.hint { font-size: 13px; color: var(--t); font-weight: 600; }\n.face.back { background: var(--tt); }\n.hide { display: inline-block; height: 40px; width: 200px; border-radius: 12px; border-radius: 7px; vertical-align: middle;\n  background: repeating-linear-gradient(135deg, var(--tt) 0 7px, transparent 7px 13px), #F6F7F9; }\n.tag-ans { align-self: center; font-size: 12px; color: var(--t); font-weight: 700; letter-spacing: .1em; }\n\n/* 拇指区 */\n.thumb { margin-top: auto; display: grid; grid-template-columns: 64px 1fr 64px; gap: 12px; align-items: center; }\n.round { width: 64px; height: 64px; border-radius: 50%; background: var(--card); box-shadow: 0 3px 0 #CBD2DB; display: grid; place-items: center; transition: transform .08s, box-shadow .08s; }\n.round:active { transform: translateY(2px); box-shadow: 0 1px 0 #CBD2DB; }\n.round svg { width: 26px; height: 26px; }\n.round.say { color: var(--acc); }\n.round.say.ping { animation: pulse .5s; }\n@keyframes pulse { 40% { box-shadow: 0 3px 0 #CBD2DB, 0 0 0 10px var(--acc-t); } }\n.next { height: 64px; border-radius: 20px; background: var(--acc); color: #fff; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px;\n  box-shadow: 0 4px 0 var(--acc-d), 0 10px 22px rgba(27,36,48,.14); transition: transform .08s, box-shadow .08s; }\n.next:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--acc-d); }\n.next svg { width: 22px; height: 22px; }\n.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }\n.tool { height: 44px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }\n.tool:active { background: rgba(27,36,48,.06); }\n.tool svg { width: 18px; height: 18px; }\n.tool.on { color: var(--acc); background: var(--acc-t); }\n\n/* 全部列表：底部抽屉 */\n.scrim { position: fixed; inset: 0; background: rgba(27,36,48,.35); z-index: 8; animation: fade .2s both; }\n@keyframes fade { from { opacity: 0; } }\n.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; max-width: 480px; margin: 0 auto; max-height: 78vh; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 8px 14px calc(16px + env(safe-area-inset-bottom)); animation: sheet .32s   s.append(m);
  if(c.kind==='url'){s.append(serviceNotice());syncService(s,c);}
  if(c.kind!=='html'||c.interactive)s.append(el('span','static',c.kind==='url'?t('live'):c.kind==='image'?t('image'):t('interactive')));
  return s;
 }
 function fit(s){
  if(!s.isConnected)return;
  const size=SIZES[st.viewport],m=s.querySelector('iframe,img'),box=s.parentElement;let r;
  if(box.classList.contains('slide')){const cs=getComputedStyle(box),w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=narrow()?Infinity:box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);r=box.dataset.zoom==='actual'?1:Math.min(w/size.w,h/size.h,1);}
  else r=Math.min(box.clientWidth/size.w,1);
  if(!(r>0))return;
  s.style.width=`${size.w*r}px`;s.style.height=`${size.h*r}px`;m.style.width=`${size.w}px`;m.style.height=`${size.h}px`;m.style.transform=`scale(${r})`;
 }
 const fitAll=()=>$$('.stage').forEach(fit),refit=()=>requestAnimationFrame(fitAll);

 function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  row(t('fonts'),c.typography);row(t('traits'),(c.traits||[]).join(' · '));return dl;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',t('viewDirection',{name:c.name}));hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark',t('selected')),el('span','peek',t('peek')));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
