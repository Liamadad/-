<title>每日单词本</title>
<style>
/* 单词卡：灰蓝底上浮白卡，厚按钮。两种看法：清单（总览、妈妈听写）和卡片（一张一张自测）。 */
:root {
  --bg: #EEF1F5; --card: #FFFFFF; --ink: #1B2430; --muted: #66707D; --line: #DFE4EA; --soft: #F3F5F8;
  --red: #E5484D; --red-d: #B8333A; --red-t: #FDECEC;
  --blue: #3A6FF0; --blue-d: #2648B8; --blue-t: #E8EEFE;
  --ink-d: #000000; --ink-t: #E4E8EE; --press: #CBD2DB;
  --tape-r: #F4C2C4; --tape-r-e: #DE8F93; --tape-b: #C5D4FA; --tape-b-e: #91ABEE;
  --shadow: 0 1px 2px rgba(27,36,48,.06), 0 8px 22px rgba(27,36,48,.08);
  --font: system-ui, -apple-system, "Roboto", "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151B; --card: #1B212A; --ink: #E8ECF2; --muted: #9AA4B2; --line: #2B333E; --soft: #232A34;
    --red: #FF6B6F; --red-d: #B2383D; --red-t: #3A1F24; --blue: #7DA2FF; --blue-d: #4467C4; --blue-t: #1C2842;
    --ink-d: #8D96A3; --ink-t: #2A323D; --press: #0B0E12; --tape-r: #5C2B31; --tape-r-e: #3B1A1E; --tape-b: #2C3F6A; --tape-b-e: #1B2847; --tape-r: #5C2B31; --tape-r-e: #3B1A1E; --tape-b: #2C3F6A; --tape-b-e: #1B2847; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151B; --card: #1B212A; --ink: #E8ECF2; --muted: #9AA4B2; --line: #2B333E; --soft: #232A34;
  --red: #FF6B6F; --red-d: #B2383D; --red-t: #3A1F24; --blue: #7DA2FF; --blue-d: #4467C4; --blue-t: #1C2842;
  --ink-d: #8D96A3; --ink-t: #2A323D; --press: #0B0E12; --tape-r: #5C2B31; --tape-r-e: #3B1A1E; --tape-b: #2C3F6A; --tape-b-e: #1B2847; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { font: 15px/1.45 var(--font); color: var(--ink); background: var(--bg); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; }

.app { --acc: var(--ink); --acc-d: var(--ink-d); --acc-t: var(--ink-t); max-width: 520px; margin: 0 auto; padding: 0 14px; }
.app[data-k="s"] { --acc: var(--red); --acc-d: var(--red-d); --acc-t: var(--red-t); }
.app[data-k="r"] { --acc: var(--blue); --acc-d: var(--blue-d); --acc-t: var(--blue-t); }

/* 顶部一行：日期、回到今天、前后一天、说明 */
.top { position: sticky; top: 0; z-index: 10; background: var(--bg); display: flex; align-items: center; gap: 2px; padding: calc(6px + env(safe-area-inset-top)) 0 6px; }
.when { flex: 1; min-width: 0; }
.when b { display: block; font-size: 19px; font-weight: 750; line-height: 1.25; }
.when small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.icon:active { background: var(--ink-t); }
.icon svg { width: 21px; height: 21px; }
.helpbtn { height: 44px; padding: 0 10px; margin-left: 2px; border-radius: 12px; font-size: 15px; font-weight: 700; color: var(--ink); flex: none; }
.helpbtn:active { background: var(--ink-t); }
.pill { height: 32px; padding: 0 12px; margin-right: 4px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; color: var(--ink); flex: none; }

/* 三叠卡 = 三个标签 */
.piles { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; padding: 4px 6px 0 0; }
.pile { --c: var(--ink); --ct: var(--ink-t); position: relative; min-height: 62px; text-align: left; padding: 8px 12px; border-radius: 14px; background: var(--card);
  box-shadow: 3px 3px 0 -1px var(--card), 3px 3px 0 0 var(--line), 6px 6px 0 -1px var(--card), 6px 6px 0 0 var(--line);
  transition: transform .28s cubic-bezier(.3,1.45,.5,1), background-color .2s; }
.pile.s { --c: var(--red); --ct: var(--red-t); }
.pile.r { --c: var(--blue); --ct: var(--blue-t); }
.pile em { display: block; font-style: normal; font-size: 13px; line-height: 18px; color: var(--muted); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pile b { display: block; font-size: 23px; line-height: 1.15; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; }
.pile[aria-selected="true"] { background: var(--c); transform: translateY(-3px);
  box-shadow: 3px 3px 0 -1px var(--ct), 3px 3px 0 0 var(--c), 6px 6px 0 -1px var(--ct), 6px 6px 0 0 var(--c), 0 10px 20px rgba(27,36,48,.12); }
.pile[aria-selected="true"] em, .pile[aria-selected="true"] b { color: #fff; }
:root[data-theme="dark"] .pile[aria-selected="true"] em, :root[data-theme="dark"] .pile[aria-selected="true"] b { color: var(--bg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pile[aria-selected="true"] em, :root:not([data-theme="light"]) .pile[aria-selected="true"] b { color: var(--bg); } }

/* 清单 / 卡片 + 打乱 */
.mode { display: flex; gap: 8px; align-items: center; margin: 16px 0 10px; }
.seg { position: relative; flex: 1; display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-radius: 14px; padding: 3px; box-shadow: var(--shadow); max-width: 220px; }
.seg i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 11px; background: var(--acc-t); transition: transform .3s cubic-bezier(.3,1.25,.5,1); }
.seg[data-v="card"] i { transform: translateX(100%); }
.seg button { position: relative; height: 40px; border-radius: 11px; font-size: 15px; font-weight: 650; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; }
.seg button svg { width: 17px; height: 17px; }
.seg button[aria-pressed="true"] { color: var(--acc); }
.tool { height: 46px; padding: 0 14px; border-radius: 14px; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 6px; background: var(--card); box-shadow: 0 3px 0 var(--press); transition: transform .08s, box-shadow .08s; flex: none; }
.tool:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--press); }
.tool svg { width: 18px; height: 18px; }
.tool.on { color: var(--acc); }
.tool:disabled { opacity: .4; box-shadow: none; transform: none; }
.link { height: 44px; padding: 0 6px; font-size: 14px; color: var(--muted); flex: none; }

/* 清单 */
.list { list-style: none; padding: 0 0 128px; display: grid; gap: 8px; }
.w { --t: var(--blue); --tt: var(--blue-t); --tp: var(--tape-b); --tpe: var(--tape-b-e); display: grid; grid-template-columns: 22px 46px minmax(0, 1fr); gap: 8px; align-items: center; background: var(--card); border-radius: 16px; padding: 10px 14px 10px 8px; box-shadow: var(--shadow); min-height: 70px; }
.w.s { --t: var(--red); --tt: var(--red-t); --tp: var(--tape-r); --tpe: var(--tape-r-e); }
.no { font-size: 14px; color: var(--ink); opacity: .72; text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.say { width: 46px; height: 46px; border-radius: 50%; background: var(--tt); color: var(--t); display: grid; place-items: center; position: relative; transition: transform .12s; }
.say svg { width: 21px; height: 21px; }
.say:active { transform: scale(.92); }
.say.playing, .round.big-say.playing { background: var(--t, var(--acc)); color: #fff; }
.round.big-say { --t: var(--acc); }
.say.ping::after, .big-say.ping::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--t, var(--acc)); animation: ping .6s ease-out forwards; }
@keyframes ping { to { transform: scale(1.5); opacity: 0; } }
.l1 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px; }
.en { font-size: 20px; font-weight: 750; letter-spacing: -.01em; line-height: 1.25; overflow-wrap: anywhere; }
.ph { font-size: 13px; color: var(--muted); }
.zh { font-size: 15px; line-height: 1.4; margin-top: 1px; overflow-wrap: anywhere; }
.tag { order: -1; align-self: center; font-size: 12px; line-height: 18px; padding: 0 6px; border-radius: 6px; background: var(--red-t); color: var(--red); font-weight: 750; }
.sj { font-style: normal; display: inline-block; font-size: 11px; line-height: 17px; padding: 0 6px; margin: 0 0 0 4px; border-radius: 9px; background: var(--soft); color: var(--muted); font-weight: 650; vertical-align: 1px; }
.hatch { display: inline-block; height: 22px; width: 120px; max-width: 100%; border-radius: 7px; vertical-align: middle;
  background: repeating-linear-gradient(135deg, var(--tt) 0 7px, transparent 7px 13px), var(--soft); }
.zh .g { display: inline-block; max-width: 100%; margin-right: .35em; }
.grp { font-size: 13px; color: var(--muted); font-weight: 650; padding: 10px 4px 0; }
.grp:first-child { padding-top: 0; }

.rules { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; margin-top: 6px; }
.rules h3 { font-size: 15px; margin-bottom: 6px; }
.rules dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
.rules dt { font-weight: 700; }
.rules dd { margin: 0; color: var(--ink); }

/* 卡片 */
.deck { display: flex; flex-direction: column; min-height: calc(100vh - 210px); min-height: calc(100dvh - 210px); padding-bottom: 150px; }
.stage { position: relative; flex: 1; min-height: 300px; max-height: 470px; margin: 4px 10px 0 0; }
.under { position: absolute; inset: 0; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); transition: transform .35s cubic-bezier(.3,1.2,.5,1), opacity .3s; }
.card { --t: var(--blue); --tt: var(--blue-t); --tp: var(--tape-b); --tpe: var(--tape-b-e); position: absolute; inset: 0; perspective: 1200px; cursor: pointer; touch-action: pan-y; }
.card.s { --t: var(--red); --tt: var(--red-t); --tp: var(--tape-r); --tpe: var(--tape-r-e); }
.card.in-next { animation: up .46s cubic-bezier(.25,1.35,.45,1) both; }
@keyframes up { from { transform: translate(10px, 16px) scale(.95); } }
.card.out-next { z-index: 3; pointer-events: none; animation: outl .34s cubic-bezier(.45,0,.85,.45) forwards; }
@keyframes outl { 80% { opacity: 1; } to { transform: translateX(-118%) rotate(-9deg); opacity: 0; } }
.card.out-prev { z-index: 0; pointer-events: none; animation: outb .3s ease-in forwards; }
@keyframes outb { to { transform: translate(10px, 16px) scale(.95); opacity: 0; } }
.card.in-prev { animation: back .36s cubic-bezier(.25,1.1,.45,1) both; }
@keyframes back { from { transform: translateX(-55%) rotate(-5deg); opacity: 0; } }
.flip { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,1.3,.45,1); }
.card.turned .flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; background: var(--card); box-shadow: var(--shadow);
  padding: 16px 18px 22px; display: flex; flex-direction: column; overflow: hidden; }
.face.back { transform: rotateY(180deg); background: var(--tt); }
.meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 24px; }
.meta b { color: var(--ink); font-size: 16px; }
.subj { display: flex; gap: 4px; } .subj .sj { margin: 0; font-size: 12px; line-height: 20px; }
.kind { font-size: 12px; line-height: 22px; padding: 0 9px; border-radius: 11px; background: var(--tt); color: var(--t); font-weight: 700; }
.face.back .kind { background: var(--card); }
.body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 4px; padding: 0 4px; }
.big-en { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.12; overflow-wrap: anywhere; }
.big-en.m { font-size: 32px; } .big-en.l { font-size: 26px; }
.big-ph { font-size: 16px; color: var(--muted); margin-top: 4px; }
.big-zh { font-size: 26px; font-weight: 700; line-height: 1.3; display: grid; gap: 4px; }
.big-zh > div { text-wrap: balance; }
.face.back .big-zh, .big-zh.sm { font-size: 22px; }
.big-zh .sj { font-size: 12px; line-height: 19px; }
.rule2 { width: 70%; border-top: 2px dashed var(--line); margin: 14px 0 10px; }
.face.back .rule2 { border-color: color-mix(in srgb, var(--t) 25%, transparent); }
.big-hatch { width: 210px; height: 46px; border-radius: 8px; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.28) 0 7px, transparent 7px 15px), var(--tp); box-shadow: 0 3px 0 var(--tpe); }
.done { position: absolute; inset: 0; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; animation: up .42s cubic-bezier(.25,1.2,.45,1) both; }
.done b { font-size: 22px; } .done p { color: var(--muted); }
.done .row { display: flex; gap: 10px; }

/* 底部拇指区 */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, transparent, var(--bg) 32%); }
.dock .in { max-width: 492px; margin: 0 auto; }
.btn { height: 58px; border-radius: 18px; font-size: 17px; font-weight: 750; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  background: var(--acc); color: #fff; box-shadow: 0 4px 0 var(--acc-d), 0 10px 22px rgba(27,36,48,.14); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--acc-d), 0 4px 10px rgba(27,36,48,.10); }
.btn.plain { background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--press), 0 10px 22px rgba(27,36,48,.08); }
.btn.plain:active { box-shadow: 0 1px 0 var(--press); }
.btn svg { width: 20px; height: 20px; }
.btn .cap { position: absolute; left: 0; right: 0; bottom: 7px; font-size: 12px; font-weight: 650; color: var(--muted); }
.btn.has-cap { position: relative; padding-bottom: 14px; height: 62px; }
:root[data-theme="dark"] .btn:not(.plain) { color: var(--bg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:not(.plain) { color: var(--bg); } }
.thumb { display: grid; grid-template-columns: 64px 1fr 64px; gap: 12px; align-items: center; }
.round { width: 64px; height: 64px; border-radius: 50%; background: var(--card); box-shadow: 0 3px 0 var(--press), 0 8px 18px rgba(27,36,48,.08); display: grid; place-items: center; position: relative; transition: transform .08s, box-shadow .08s; }
.round:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--press); }
.round svg { width: 26px; height: 26px; }
.round:disabled { opacity: .35; }
.big-say { color: var(--acc); }

/* 开始检查：妈妈考或弟弟自己考 */
.checking #prev, .checking #next, .checking #today { visibility: hidden; }
.btn.ink { background: var(--ink); color: var(--bg); box-shadow: 0 4px 0 var(--ink-d), 0 10px 22px rgba(27,36,48,.16); flex-direction: column; gap: 0; height: 64px; }
.btn.ink:active { box-shadow: 0 1px 0 var(--ink-d); }
.btn.ink .t { display: flex; align-items: center; gap: 8px; font-size: 18px; }
.btn.ink small { font-size: 12px; font-weight: 600; opacity: .7; }
.ck-head { display: flex; align-items: center; gap: 8px; min-height: 62px; padding-top: 4px; }
.steps { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); min-width: 0; }
.steps span { padding: 5px 10px; border-radius: 999px; background: var(--card); white-space: nowrap; }
.steps span.on { background: var(--acc); color: #fff; }
.steps span.ok { color: var(--ink); }
.steps i { width: 10px; height: 2px; background: var(--line); flex: none; }
:root[data-theme="dark"] .steps span.on { color: var(--bg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .steps span.on { color: var(--bg); } }
.ck-bar { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 2px 10px; }
.ck-bar b { font-size: 20px; }
.ck-bar span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ck-bar .link { height: 32px; }
.w.ck { grid-template-columns: 22px minmax(0, 1fr) 40px; cursor: pointer; padding-left: 10px; }
.mk { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--muted); font-weight: 800; font-size: 16px; transition: transform .2s cubic-bezier(.3,1.5,.5,1), background-color .15s; }
.w.ck.wrong { background: var(--red-t); }
.w.ck.wrong .mk { background: var(--red); color: #fff; transform: rotate(-8deg) scale(1.08); }
.w.ck.wrong .en { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.thumb3 { display: grid; grid-template-columns: 64px 1fr 1fr; gap: 10px; align-items: center; }
.btn.no { background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--press), 0 10px 22px rgba(27,36,48,.08); }
.btn.no:active { box-shadow: 0 1px 0 var(--press); }
.res { display: grid; gap: 10px; margin-top: 14px; }
.res .r { display: grid; grid-template-columns: 1fr auto; align-items: center; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; }
.res .r b { font-size: 17px; } .res .r .n { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.res .r .n small { font-size: 16px; color: var(--muted); font-weight: 650; }
.res .r p { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.res .r.pass p { color: var(--ink); font-weight: 700; }
.res .r.fail p { color: var(--red); font-weight: 700; }
.wrongs h3 { font-size: 15px; margin: 18px 2px 8px; }
.ck-dock2 { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.ck-dock2 .btn.no { width: auto; padding: 0 22px; }
.exit-arm { color: var(--red) !important; }

/* 开始前、结束、说明 */
.note { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 22px 20px; margin-top: 18px; }
.note b { display: block; font-size: 20px; margin-bottom: 6px; }
.note p { color: var(--muted); }
.note .btn { margin-top: 16px; }
.scrim { position: fixed; inset: 0; background: rgba(17,21,27,.4); z-index: 20; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 520px; margin: 0 auto; max-height: 82vh; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0;
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); animation: sheet .32s cubic-bezier(.25,1.05,.45,1) both; }
@keyframes sheet { from { transform: translateY(100%); } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--press); margin: 4px auto 12px; }
.sheet h2 { font-size: 18px; margin: 0 2px 10px; }
.sheet ol { padding-left: 20px; display: grid; gap: 8px; font-size: 15px; }
.sheet .rules { margin: 14px 0 0; }
.sheet .close { margin-top: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 15; pointer-events: none; white-space: nowrap;
  background: rgba(27,36,48,.92); color: #fff; font-size: 14px; font-weight: 650; padding: 9px 16px; border-radius: 999px; animation: toast 1.7s ease both; }
.toast.hi { bottom: calc(112px + env(safe-area-inset-bottom)); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 8px); } 12%, 78% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }

/* 第一次打开：主角先到，其余依次跟上 */
.first .piles, .first .mode, .first .list > *, .first .stage { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.first .mode { animation-delay: 60ms; }
.first .list > *:nth-child(n) { animation-delay: calc(110ms + min(var(--i, 0), 8) * 40ms); }
.first .stage { animation-name: drop; animation-delay: 110ms; animation-duration: .55s; animation-timing-function: cubic-bezier(.2,1.3,.4,1); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

<script>
const W = /*__DATA__*/null;
const START = Date.UTC(2026, 9, 12);          // 2026-10-12, Monday
const DAY = 86400000;
const OFFSETS = [1, 2, 4, 7, 15, 30];          // review after N study days
const WEEKDAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
// weeks are counted from the start Monday; s / r = new 默写 / 认识 words per study day
const PLAN = [
  { to: 12, s: 10, r: 20, name: '第一阶段 · 打基础' },
  { to: 44, s: 10, r: 20, name: '第二阶段 · 扩词汇' },
  { to: 50, s: 5, r: 10, name: '第三阶段 · 巩固' },
  { to: 55, s: 0, r: 0, name: '冲刺 · 只复习' },
  { to: 64, s: 5, r: 10, name: '考后 · 继续积累' },
];
const WEEKS = PLAN[PLAN.length - 1].to;
const SPRINT = 4;                                // index+1 of the review-only phase
const phaseOfWeek = w => PLAN.findIndex(p => w <= p.to) + 1;

const utc = d => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
const fromUTC = t => { const x = new Date(t); return new Date(x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate(), 12); };
const fmt = d => `${d.getMonth() + 1}月${d.getDate()}日`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// OFF[d] = how many 默写 / 认识 words come before study day d (1-based); OFF[d+1] is the end of day d
const OFF = [{ s: 0, r: 0 }, { s: 0, r: 0 }];
for (let d = 1; d <= WEEKS * 5; d++) {
  const p = PLAN[phaseOfWeek(Math.ceil(d / 5)) - 1];
  const prev = OFF[d];
  OFF[d + 1] = { s: Math.min(prev.s + p.s, W.S.length), r: Math.min(prev.r + p.r, W.R.length) };
}

function info(date) {
  const diff = Math.round((utc(date) - START) / DAY);
  if (diff < 0) return { kind: 'before', diff };
  const week = Math.floor(diff / 7) + 1, dow = diff % 7;
  if (week > WEEKS) return { kind: 'after' };
  const phase = phaseOfWeek(week);
  if (dow <= 4) return { kind: 'study', week, dow, phase, d: (week - 1) * 5 + dow + 1 };
  return { kind: dow === 5 ? 'sat' : 'sun', week, dow, phase };
}
// new words of study day d, as index ranges into W.S (默写) and W.R (认识); null when the day has none
function dayWords(d) {
  if (d < 1 || d > WEEKS * 5) return null;
  const a = OFF[d], b = OFF[d + 1];
  if (b.s === a.s && b.r === a.r) return null;
  return { s: [a.s, b.s], r: [a.r, b.r] };
}
function learned(d) {                            // words learned by the end of study day d
  if (d <= 0) return { s: 0, r: 0 };
  return OFF[Math.min(d, WEEKS * 5) + 1];
}
function dateOfStudyDay(d) {
  const week = Math.ceil(d / 5), dow = (d - 1) % 5;
  return fromUTC(START + ((week - 1) * 7 + dow) * DAY);
}
const range = ([a, b], list) => list.slice(a, b);
function weekWords(week) {
  const s = [], r = [];
  for (let d = (week - 1) * 5 + 1; d <= week * 5; d++) {
    const w = dayWords(d); if (!w) continue;
    s.push(...range(w.s, W.S)); r.push(...range(w.r, W.R));
  }
  return { s, r };
}
const isLastSatOfMonth = date => new Date(date.getTime() + 7 * DAY).getMonth() !== date.getMonth();

// ---- shuffling: a seeded order, so the list and the cards share one order and a reload keeps it
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shuffled(arr, seed) {
  const a = arr.slice(), r = rng(seed);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const newSeed = () => ((Math.random() * 4294967295) >>> 0) || 1;
// a fixed seed per day and pile: the same day always draws the same test words until 「换一组」
const hashSeed = str => { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) || 1; };

// ECDICT writes phonetics in an older notation; show them the way school dictionaries do
function ipa(p) {
  if (!p) return '';
  let s = p.replace(/[әə]/g, 'ə').replace(/є/g, 'e').replace(/:/g, 'ː').replace(/'/g, 'ˈ').replace(/(^|[\s])[.,]/g, '$1ˌ').replace(/\.(?=\S)/g, 'ˌ');
  const D = [['ei', 'eɪ'], ['ai', 'aɪ'], ['ɔi', 'ɔɪ'], ['au', 'aʊ'], ['əu', 'əʊ'], ['iə', 'ɪə'], ['uə', 'ʊə'], ['eə', 'eə']];
  D.forEach(([a, b], i) => { s = s.split(a).join('\u0001' + i + '\u0002'); });
  s = s.replace(/i(?!ː)(?=\S)/g, 'ɪ').replace(/u(?!ː)/g, 'ʊ');
  return s.replace(/\u0001(\d)\u0002/g, (_, i) => D[+i][1]);
}
// meanings carry the subject in brackets: （经济）（物理）（数学）（指令词）, shown as small tags
const SUBJ = /（((?:经济|物理|数学|指令词)(?:、(?:经济|物理|数学|指令词))*)）/g;
const zhHTML = z => esc(z).replace(SUBJ, (_, t) => `<i class="sj">${t.replace('指令词', '考试指令')}</i>`);
// on a card each part of speech gets its own line, so a meaning never breaks in the middle
const zhLines = z => z.split('；').slice(0, 3).map(g => `<div>${esc(g.replace(SUBJ, ''))}</div>`).join('');
const subjOf = z => [...new Set([...z.matchAll(SUBJ)].flatMap(m => m[1].split('、')))].map(t => `<i class="sj">${t.replace('指令词', '考试指令')}</i>`).join('');
// in a list row each sense stays in one piece; lines only break between senses
const zhList = z => z.split('；').map((g, i, a) => `<span class="g">${zhHTML(g)}${i < a.length - 1 ? '；' : ''}</span>`).join('');

// views: id -> { label, k: 's' | 'r' | 'v', its?, groups?, random? }; items are { e: [word, phonetic, meaning], spell }
const items = (arr, spell) => arr.map(e => ({ e, spell }));
function buildViews(it, date) {
  const views = {}; let rules = null, test = null;
  if (it.kind === 'study') {
    const groups = [];
    for (const k of OFFSETS) {
      const src = it.d - k; if (src < 1) continue;
      const w = dayWords(src); if (!w) continue;
      const title = `${fmt(dateOfStudyDay(src))}学的`;
      groups.push({ title, its: [...items(range(w.s, W.S), true), ...items(range(w.r, W.R), false)].map(x => ({ ...x, g: title })) });
    }
    const n = groups.reduce((a, g) => a + g.its.length, 0);
    if (n) views.review = { label: '复习', k: 'v', groups };
    const nw = dayWords(it.d);
    if (nw) {
      const s = range(nw.s, W.S), r = range(nw.r, W.R);
      views.spell = { label: '默写', k: 's', its: items(s, true), pass: [s.length, Math.ceil(s.length * 0.8)] };
      views.rec = { label: '认识', k: 'r', its: items(r, false), pass: [r.length, Math.ceil(r.length * 0.9)] };
      test = { s: { pool: s, n: s.length, pass: Math.ceil(s.length * 0.8) }, r: { pool: r, n: r.length, pass: Math.ceil(r.length * 0.9) } };
      rules = { title: '妈妈每天检查', rows: [
        ['默写', `${s.length} 个全部听写，对 ${Math.ceil(s.length * 0.8)} 个过关。`],
        ['认识', `${r.length} 个全部查，对 ${Math.ceil(r.length * 0.9)} 个过关。`],
        ['没过', '当晚重看错的词，只重考错的那几个，不罚。']] };
    } else {
      rules = { title: '冲刺期', rows: [['新词', '这几周不学新词。'], ['每天', '把复习做完，再过一遍本子上的错词。妈妈不用每天查。'], ['周六', '从学过的所有词里做总复习检查。']] };
    }
    return { views, rules, test };
  }
  const sat = it.kind === 'sat';
  const sprint = it.phase === SPRINT;
  const satDate = sat ? date : new Date(date.getTime() - DAY);
  const monthly = !sprint && isLastSatOfMonth(satDate);
  const ww = weekWords(it.week);
  const upTo = learned(it.week * 5);
  const allS = W.S.slice(0, upTo.s), allR = W.R.slice(0, upTo.r);
  const rows = [];
  if (sprint) {
    test = { s: { pool: allS, n: 10, pass: 8 }, r: { pool: allR, n: 50, pass: 38 } };
    rows.push(['默写', '每次检查从学过的所有默写词里随机抽 10 个，对 8 个过关。'], ['认识', '从学过的所有认识词里随机抽 50 个，对 38 个过关。']);
  } else {
    views.spell = { label: '本周默写', k: 's', its: items(ww.s, true) };
    views.rec = { label: '本周认识', k: 'r', its: items(ww.r, false) };
    test = { s: { pool: ww.s, n: 10, pass: 8 }, r: monthly ? { pool: allR, n: 50, pass: 38 } : { pool: ww.r, n: 30, pass: 26 } };
    rows.push(['默写', `每次检查从这周的 ${ww.s.length} 个默写词里随机抽 10 个，对 8 个过关。`]);
    rows.push(['认识', monthly ? '月考：从学过的所有认识词里随机抽 50 个，对 38 个过关。' : `从这周的 ${ww.r.length} 个认识词里随机抽 30 个，对 26 个过关。`]);
  }
  if (sat) {
    rows.push(['没过', '周日补考一次；补考还没过，下周一到周五不玩游戏，周末照常。']);
    rules = { title: sprint || monthly ? '今天是总复习检查' : '妈妈周测', rows };
  } else {
    rows.push(['补考', '周六没过关才需要。按「周日补考」重新随机抽一组，标准和周六一样。']);
    rules = { title: '周日：复习和补考', rows };
  }
  return { views, rules, test };
}

function row(it, i, n, mixed) {
  const e = it.e, ph = ipa(e[1]);
  return `<li class="w${it.spell ? ' s' : ''}" data-i="${i}" style="--i:${n}"><span class="no">${i + 1}</span>`
    + `<button class="say" type="button" data-say="${esc(e[0])}" aria-label="播放 ${esc(e[0])} 的发音">${SPEAKER}</button>`
    + `<div><div class="l1">${mixed && it.spell ? '<span class="tag">写</span>' : ''}<span class="en">${esc(e[0])}</span>${ph ? `<span class="ph">/${esc(ph)}/</span>` : ''}</div><div class="zh">${zhList(e[2])}</div></div></li>`;
}
const SPEAKER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const I = {
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="13" height="15" rx="2.5"/><path d="M8 3.5h9.5A2.5 2.5 0 0 1 20 6v11.5"/></svg>',
  shuffle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5V3h6v1.5M9 12.5l2 2 4-4.5"/></svg>',
  yes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
  hide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 4l16 16"/></svg>'
};

// ---- pronunciation: Youdao dictionary audio (real recordings, works in mainland China and HK), device voice as fallback
let player = null;
function voice() {
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  return vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
function deviceSpeak(word) {
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    const v = voice(); if (v) u.voice = v;
    u.lang = v ? v.lang : 'en-GB'; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (err) { /* no voice available */ }
}
let playingEl = null;
function playing(el, on) {
  if (playingEl && playingEl !== el) playingEl.classList.remove('playing');
  playingEl = on ? el : null;
  if (el) el.classList.toggle('playing', !!on);
}
function speak(word, el) {
  if (player) { try { player.pause(); } catch (err) {} player = null; }
  playing(el, true);
  const stop = () => playing(el, false);
  clearTimeout(speak.t); speak.t = setTimeout(stop, 4000);
  let fell = false;
  const fallback = () => { if (!fell) { fell = true; deviceSpeak(word); clearTimeout(speak.t); speak.t = setTimeout(stop, 1500); } };
  try {
    const a = new Audio('https://dict.youdao.com/dictvoice?type=1&audio=' + encodeURIComponent(word));
    player = a;
    a.addEventListener('error', fallback, { once: true });
    a.addEventListener('ended', stop, { once: true });
    const p = a.play();
    if (p && typeof p.catch === 'function') p.catch(err => { if (!err || err.name !== 'AbortError') fallback(); });
  } catch (err) { fallback(); }
}
if (window.speechSynthesis && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', () => {});

// ---- state; kept in the address (#...) so a reload, or Android bringing the tab back, keeps the same day, order and card
const S = { cur: new Date(), tab: null, view: 'list', seeds: {}, idx: 0, turned: false, dir: 0, first: true };
S.cur.setHours(12, 0, 0, 0);
const ymd = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const viewKey = () => ymd(S.cur) + ':' + S.tab;
function save() {
  const q = new URLSearchParams({ d: ymd(S.cur), t: S.tab || '', v: S.view, i: S.idx, s: S.seeds[viewKey()] || 0, at: Math.floor(Date.now() / 60000) });
  try { history.replaceState(null, '', '#' + q); } catch (err) {}
}
function restore() {
  try {
    // the saved place only comes back when the same page is reloaded (or Android restores the tab);
    // opening the link again always starts from today, by the phone's own date (Hong Kong time there)
    const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    const reloaded = document.wasDiscarded || (nav && (nav.type === 'reload' || nav.type === 'back_forward'));
    const fromHash = location.hash.length > 1 && reloaded;
    // ?state=d:2026-10-13~t:spell~v:card opens a given day and view (used for screenshots)
    const st = new URLSearchParams(location.search).get('state');
    const q = new URLSearchParams(fromHash ? location.hash.slice(1) : st ? st.split('~').map(x => x.replace(':', '=')).join('&') : '');
    if (!q.get('d')) { if (location.hash.length > 1) history.replaceState(null, '', location.pathname + location.search); return; }
    if (fromHash && Date.now() / 60000 - (+q.get('at') || 0) > 360) return;   // older than 6 hours: start from today
    const [y, m, d] = q.get('d').split('-').map(Number);
    S.cur = new Date(y, m - 1, d, 12);
    S.tab = q.get('t') || null; S.view = q.get('v') === 'card' ? 'card' : 'list';
    S.idx = +q.get('i') || 0;
    if (+q.get('s')) S.seeds[viewKey()] = +q.get('s');
  } catch (err) {}
}

let V = null;                                    // the current day: { it, views, rules, ids, v, its }
function compute() {
  const it = info(S.cur);
  if (it.kind === 'before' || it.kind === 'after') { V = { it, ids: [] }; return; }
  const { views, rules, test } = buildViews(it, S.cur);
  const ids = Object.keys(views);
  if (!views[S.tab]) S.tab = ids[0] || null;
  const v = views[S.tab];
  let its = [];
  if (v) {
    if (v.random && !S.seeds[viewKey()]) S.seeds[viewKey()] = hashSeed(viewKey());
    const seed = S.seeds[viewKey()];
    const flat = v.its || (v.groups ? v.groups.flatMap(g => g.its) : []);
    its = v.random ? v.random(seed) : seed ? shuffled(flat, seed) : flat;
  }
  S.idx = Math.max(0, Math.min(S.idx, its.length));
  V = { it, views, rules, ids, v, its, test };
}
const countOf = v => v.n != null ? v.n : (v.its || v.groups.flatMap(g => g.its)).length;

const $ = id => document.getElementById(id);
function render() {
  compute();
  const { it } = V, app = $('app');
  app.classList.toggle('first', S.first);
  $('date').textContent = `${fmt(S.cur)} ${WEEKDAYS[(S.cur.getDay() + 6) % 7]}`;
  $('today').hidden = utc(S.cur) === utc(new Date());
  if (it.kind === 'before' || it.kind === 'after') {
    $('sub').textContent = '';
    $('piles').innerHTML = ''; $('mode').innerHTML = ''; $('dock').innerHTML = '';
    app.dataset.k = 'v';
    $('main').innerHTML = it.kind === 'before'
      ? `<section class="note"><b>计划从 10月12日（周一）开始</b><p>每周一到周五学新词，周六妈妈周测，周日复习和补考。</p><button class="btn" type="button" id="goStart">先看看第一天</button></section>`
      : `<section class="note"><b>单词计划完成了</b><p>从 2026 年 10 月到 2027 年底，辛苦了。</p></section>`;
    const g = $('goStart'); if (g) g.onclick = () => { S.cur = fromUTC(START); S.tab = null; S.idx = 0; S.dir = 1; render(); };
    save(); return;
  }
  $('sub').textContent = it.kind === 'study' ? `第 ${it.week} 周 · 第 ${it.d} 天` : `第 ${it.week} 周 · ${it.kind === 'sat' ? '妈妈周测' : '复习和补考'}`;
  if (C) { renderCheck(); saveCheck(); save(); return; }
  app.classList.remove('checking');
  const v = V.v;
  app.dataset.k = v ? v.k : 'v';

// ---- 开始检查 (mom quizzes, or the boy tests himself): one guided pass. 1 默写 dictation card by card (the sound plays by itself), 2 the answers in the same
// order, mom taps the ones written wrong, 3 认识 card by card, mom taps 会 / 不会, 4 the result, with a retest of the wrong ones.
// Counts live only in this pass (kept for a reload of the same evening), nothing is stored as learning records.
let C = null;   // { title, s, r, passS, passR, phase: 'S' | 'SA' | 'R' | 'end', i, wrong: [i...], know: [true/false...], turned, retry }
function checkSets() {
  const { it, test } = V;
  if (!test || !test.s.pool.length && !test.r.pool.length) return null;
  const title = it.kind === 'study' ? '开始检查' : it.kind === 'sun' ? '周日补考' : it.phase === SPRINT ? '总复习检查' : test.r.n === 50 ? '周测和月考' : '开始周测';
  return { title, ...test };
}
function startCheck() {
  const ck = checkSets(); if (!ck) return;

  const s = items(shuffled(ck.s.pool, seed).slice(0, ck.s.n), true), r = items(shuffled(ck.r.pool, seed ^ 0x5bd1e995).slice(0, ck.r.n), false);
  C = { title: ck.title, s, r, passS: s.length ? [s.length, ck.s.pass] : null, passR: r.length ? [r.length, ck.r.pass] : null,
        phase: s.length ? 'S' : 'R', i: 0, wrong: [], know: [], turned: false, day: ymd(S.cur) };
  S.first = false; render(); window.scrollTo(0, 0);

}
function saveCheck() { try { sessionStorage.setItem('danciCheck', JSON.stringify({ ...C, at: Date.now() })); } catch (err) {} }

function restoreCheck() {

  } catch (err) {}
}
function sayCheck() { const list = C.phase === 'S' ? C.s : C.r, x = list[C.i]; const b = $('bigsay'); if (x) speak(x.e[0], b); }

function renderCheck() {

    const q = spell ? `<div class="big-hatch" aria-label="英文已遮住"></div><div class="rule2"></div><div class="big-zh">${zhLines(e[2])}</div>`
                    : `${bigWord(e)}<div class="rule2"></div><div class="big-hatch" aria-label="中文已遮住"></div>`;
    const cls = S.dir > 0 ? ' in-next' : S.dir < 0 ? ' in-prev' : '';
    $('main').innerHTML = `<div class="ck-bar"><b>第 ${C.i + 1} 个</b><span>共 ${n} 个${C.i && !spell ? ' · <button class="link" type="button" id="ckBack">上一个</button>' : ''}</span></div>`
      + `<section class="deck"><div class="stage" id="stage">${unders}<div class="card${spell ? ' s' : ''}${C.turned ? ' turned' : ''}${cls}" id="card" role="button" tabindex="0" aria-label="翻面看答案"><div class="flip">`
      + `<div class="face"><div class="meta"><span><b>${C.i + 1}</b> / ${n}</span><span class="subj">${subjOf(e[2])}</span></div><div class="body">${q}</div></div>`
      + `<div class="face back" aria-hidden="${!C.turned}"><div class="meta"><span><b>${C.i + 1}</b> / ${n}</span><span class="subj">${subjOf(e[2])}</span></div><div class="body">${bigWord(e)}<div class="rule2"></div><div class="big-zh">${zhLines(e[2])}</div></div></div>`
      + `</div></div></div></section>`;
    $('dock').innerHTML = spell
      ? `<div class="in thumb"><button class="round" type="button" id="ckBack2" aria-label="上一个"${C.i ? '' : ' disabled'}>${I.prev}</button>`
        + `<button class="btn" type="button" id="ckNext">${C.i < n - 1 ? '下一个' : '写完了，对答案'}${I.next}</button>`

    const box = (label, got, all, pass) => all ? `<div class="r ${pass ? (got >= pass[1] ? 'pass' : 'fail') : ''}"><b>${label}</b><span class="n">${got}<small> / ${all}</small></span><p>${passText(got, all, pass) || ' '}</p></div>` : '';
    const fail = V.rules && V.rules.rows.find(r => r[0] === '没过' || r[0] === '补考');

    $('main').innerHTML = `<div class="res">${box('默写', gs, ns, C.passS)}${box('认识', gr, nr, C.passR)}</div>`
      + (wrongs.length ? `<div class="wrongs"><h3>错的 ${wrongs.length} 个</h3><ol class="list">${wrongs.map((x, i) => row(x, i, i)).join('')}</ol></div>` : '')
      + (fail && wrongs.length ? `<section class="rules"><dl><dt>${fail[0]}</dt><dd>${fail[1]}</dd></dl></section>` : '');
    $('dock').innerHTML = wrongs.length
      ? `<div class="in ck-dock2"><button class="btn" type="button" id="ckRetry">只重考错的 ${wrongs.length} 个</button><button class="btn no" type="button" id="ckDone">完成</button></div>`
      : `<div class="in"><button class="btn" type="button" id="ckDone">完成</button></div>`;
  }
}
function checkStep(d) {
  const list = C.phase === 'S' ? C.s : C.r, old = $('card');

  if (C.i + d >= list.length) { C.phase = C.phase === 'S' ? 'SA' : 'end'; C.i = 0; C.turned = false; render(); window.scrollTo(0, 0); return; }
  C.i += d; C.turned = false; S.dir = d; render(); S.dir = 0;
  if (old && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    old.removeAttribute('id'); old.classList.remove('in-next', 'in-prev'); old.classList.add(d > 0 ? 'out-next' : 'out-prev');
    $('stage').appendChild(old); setTimeout(() => old.remove(), 380);

let exitArmed = 0;
function checkClick(t) {
  switch (t.id) {
    case 'ckExit':
      if (C.phase === 'end' || Date.now() - exitArmed < 2500) { endCheck(); return true; }
      exitArmed = Date.now(); t.textContent = '再按一次退出'; t.classList.add('exit-arm');
      setTimeout(() => { if ($('ckExit')) { $('ckExit').textContent = '退出'; $('ckExit').classList.remove('exit-arm'); } }, 2500);
      return true;
    case 'ckNext': checkStep(1); return true;
    case 'ckBack': case 'ckBack2':
      if (C.phase === 'R' && C.i > 0) C.know[C.i - 1] = undefined;
      checkStep(-1); return true;
    case 'ckYes': case 'ckNo': C.know[C.i] = t.id === 'ckYes'; checkStep(1); return true;
    case 'ckToR': C.phase = C.r.length ? 'R' : 'end'; C.i = 0; C.turned = false; S.dir = 1; render(); S.dir = 0; window.scrollTo(0, 0); return true;
    case 'ckRetry': {

      S.dir = 1; render(); S.dir = 0; window.scrollTo(0, 0); if (C.phase === 'S') sayCheck(); return true;

}

// ---- events
document.addEventListener('click', e => {

      else { S.cur = new Date(); S.cur.setHours(12, 0, 0, 0); S.tab = null; }

document.addEventListener('keydown', e => {
